s\r\n    \r\n    Scenario: Sélectionner une seule date dans l'historique et affichage des statistiques \r\n        Given L'utilisateur est sur la page \"Statistiques RDV\"\r\n        When L'utilisateur clique sur \"Historiques\" et sélectionne une seule date \r\n        Then Seule la date choisie est sélectionnée\r\n\r\n    Scenario: Exporter les statistiques au format XLS\r\n        Given L'utilisateur est sur la page \"Statistiques RDV\"\r\n        When L'utilisateur clique sur le bouton \"Exporter en XLS\"\r\n        Then Un fichier Excel est téléchargé contenant les données des RDV\r\n    \r\n    Scenario: Exporter les statistiques au format PDF\r\n        Given L'utilisateur est sur la page \"Statistiques RDV\"\r\n        When L'utilisateur clique sur le bouton \"Exporter en PDF\"\r\n        Then Un fichier PDF est téléchargé contenant les données des RDV\r\n\r\n","uri":"src\\test\\statistiques-rdv\\features\\statistiques-rdv.feature","mediaType":"text\/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[{"location":{"line":1,"column":1},"name":"@StatistiquesRdv","id":"a54affbe-6172-4e8c-ac86-6c00ae3a9128"}],"location":{"line":2,"column":1},"language":"en","keyword":"Feature","name":"Console de pilotage en temps différé : Statistiques RDV","description":"","children":[{"background":{"id":"eca3c9f2-61cf-4d08-9bd1-361b8170641b","location":{"line":4,"column":5},"keyword":"Background","name":"","description":"","steps":[{"id":"7cfdb401-9c7c-4f79-bd9b-2b2d4362d71c","location":{"line":5,"column":9},"keyword":"Given ","keywordType":"Context","text":"L'utilisateur est connecté à l'application Troov"}]}},{"scenario":{"id":"f6e497b6-b62a-49b5-a272-329b92458ff0","tags":[],"location":{"line":7,"column":5},"keyword":"Scenario","name":"Accéder à la page Statistiques RDV","description":"","steps":[{"id":"76f00dbc-3651-4e37-8132-44726376ee42","location":{"line":8,"column":9},"keyword":"When ","keywordType":"Action","text":"L'utilisateur clique sur \"Statistiques
